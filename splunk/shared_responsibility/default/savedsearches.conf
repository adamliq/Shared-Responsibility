[SRM Evidence - LOG-004]
description = Evidence for LOG-004: Monitored indexes are receiving events. Method: tstats event counts across `srm_monitored_indexes` in the last 24 hours.
search = | tstats count where `srm_monitored_indexes` by index | stats sum(count) as metric dc(index) as indexes | fillnull value=0 metric indexes | eval status=if(metric>0,"pass","fail"), evidence=indexes." monitored index(es) received ".metric." events in the last 24 hours" | `srm_record_evidence("LOG-004","Monitored indexes are receiving events")`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 5 * * * *
enableSched = 1
is_visible = true

[SRM Evidence - COL-016]
description = Evidence for COL-016: End-to-end collection latency within 5 minutes (p95). Method: 95th percentile of _indextime - _time for recent events.
search = `srm_monitored_indexes` | head 50000 | eval lag=_indextime-_time | stats count perc95(lag) as p95 | eval metric=round(coalesce(p95,0),1), status=case(count=0,"no_evidence",p95<=300,"pass",true(),"fail"), evidence=if(count=0,"No events in the last hour to measure","p95 indexing latency ".metric." s across ".count." sampled events (target 300 s)") | `srm_record_evidence("COL-016","End-to-end collection latency within 5 minutes (p95)")`
dispatch.earliest_time = -60m
dispatch.latest_time = now
cron_schedule = 10 * * * *
enableSched = 1
is_visible = true

[SRM Evidence - COL-006]
description = Evidence for COL-006: Source event time preserved (skew under 1%). Method: Share of events whose index time is before event time or more than a day after it.
search = `srm_monitored_indexes` | head 50000 | eval skew=_indextime-_time | stats count count(eval(skew<0 OR skew>86400)) as bad | eval metric=if(count>0,round(bad/count*100,2),0), status=case(count=0,"no_evidence",metric<1,"pass",true(),"fail"), evidence=if(count=0,"No events in the last 24 hours to measure",bad." of ".count." sampled events (".metric."%) have implausible timestamps") | `srm_record_evidence("COL-006","Source event time preserved (skew under 1%)")`
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 15 * * * *
enableSched = 1
is_visible = true

[SRM Evidence - LOG-010]
description = Evidence for LOG-010: Monitored indexes retain events for 12 months. Method: frozenTimePeriodInSecs of each enabled non-internal index.
search = | rest /services/data/indexes splunk_server=local count=0 | search disabled=0 NOT title="_*" NOT title IN ("history","summary","splunklogger","lastchanceindex") | eval days=round(frozenTimePeriodInSecs/86400) | stats count as indexes count(eval(days<365)) as short min(days) as metric values(eval(if(days<365,title,null()))) as short_indexes | fillnull value=0 indexes short | eval status=case(indexes=0,"no_evidence",short=0,"pass",true(),"fail"), evidence=if(short=0,indexes." index(es) retain at least ".metric." days",short." index(es) retain under 365 days: ".mvjoin(short_indexes,", ")) | `srm_record_evidence("LOG-010","Monitored indexes retain events for 12 months")`
dispatch.earliest_time = -1m
dispatch.latest_time = now
cron_schedule = 20 2 * * *
enableSched = 1
is_visible = true

[SRM Evidence - LOG-012]
description = Evidence for LOG-012: Access attempts to the logging platform are audited. Method: Login attempts recorded in the _audit index over seven days.
search = index=_audit action="login attempt" | stats count as metric count(eval(info="failed")) as failed | fillnull value=0 metric failed | eval status=if(metric>0,"pass","no_evidence"), evidence=metric." login attempts audited in 7 days, ".failed." failed" | `srm_record_evidence("LOG-012","Access attempts to the logging platform are audited")`
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 25 * * * *
enableSched = 1
is_visible = true

[SRM Evidence - LOG-013]
description = Evidence for LOG-013: No user can delete indexed events. Method: Users holding the can_delete role.
search = | rest /services/authentication/users splunk_server=local count=0 | search roles="can_delete" | stats count as metric values(title) as holders | fillnull value=0 metric | eval status=if(metric=0,"pass","fail"), evidence=if(metric=0,"No user holds the can_delete role",metric." user(s) can delete events: ".mvjoin(holders,", ")) | `srm_record_evidence("LOG-013","No user can delete indexed events")`
dispatch.earliest_time = -1m
dispatch.latest_time = now
cron_schedule = 30 * * * *
enableSched = 1
is_visible = true

[SRM Evidence - LOG-009]
description = Evidence for LOG-009: Security monitoring alerts are scheduled. Method: Enabled scheduled searches with an alert action or triggered-alert tracking.
search = | rest /servicesNS/-/-/saved/searches splunk_server=local count=0 | search is_scheduled=1 disabled=0 | where 'alert.track'=1 OR (isnotnull(actions) AND actions!="") | stats count as metric | eval status=if(metric>0,"pass","fail"), evidence=metric." enabled alert(s) scheduled" | `srm_record_evidence("LOG-009","Security monitoring alerts are scheduled")`
dispatch.earliest_time = -1m
dispatch.latest_time = now
cron_schedule = 35 * * * *
enableSched = 1
is_visible = true

